<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pesquisa em Lotes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f0faff;
      padding: 40px;
      text-align: center;
    }

    h2 {
      margin-bottom: 30px;
    }

    .filtro-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .filtro-container select,
    .filtro-container input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 200px;
    }

    .botao-pesquisar {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #0090ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .botao-pesquisar:hover {
      background-color: #0070cc;
    }

    .resultado-lista {
      margin-top: 30px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    .alvo-item {
      background-color: #fff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alvo-item span {
      font-weight: bold;
    }

    .ver-btn {
      background: none;
      border: none;
      color: #0090ff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Modal tela cheia com layout lateral */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.85);
      overflow-y: auto;
    }

    .modal-content {
      background-color: #fff;
      margin: 5vh auto;
      padding: 30px;
      border-radius: 12px;
      width: 95%;
      max-width: 1000px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .modal-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: flex-start;
    }

    .modal-content img {
      width: 250px;
      height: auto;
      border-radius: 8px;
      cursor: zoom-in;
    }

    .modal-foto-expandida {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90vw;
      max-height: 90vh;
      z-index: 99999;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      cursor: zoom-out;
    }

    .modal-dados {
      flex: 1;
      min-width: 300px;
    }

    .anotacoes-scroll {
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 8px;
      margin-top: 10px;
      text-align: left;
    }

    .close {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }

    .highlight {
  background-color: #fff176 !important;
  color: #000 !important;
  font-weight: bold;
  padding: 2px 4px;
  border-radius: 4px;
}

    .botao-voltar {
  position: fixed;
  top: 20px;
  left: 20px;
  background-color: #0090ff;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  z-index: 10000;
  box-shadow: 0 0 6px rgba(0,0,0,0.2);
  transition: background-color 0.3s;
}

.botao-voltar:hover {
  background-color: #0070cc;
}
  </style>
</head>
<body>

  <h2>Pesquisar em Lotes</h2>

  <form method="POST">
    <div class="filtro-container">
      <select id="municipio" name="municipio" onchange="atualizarBairros()">
        <option value="">Município</option>
        <option value="FORTALEZA">FORTALEZA</option>
        <option value="CAUCAIA">CAUCAIA</option>
      </select>

      <select id="bairro" name="bairro">
        <option value="">Bairro</option>
      </select>

      <select name="facção">
        <option value="">Facção</option>
        <option value="CV">CV</option>
        <option value="GDE">GDE</option>
        <option value="PCC">PCC</option>
        <option value="MASSA">MASSA</option>
        <option value="ADA">ADA</option>
        <option value="TCP">TCP</option>
        <option value="AQ">AQ</option>
        <option value="SEM">SEM</option>

      </select>

      <input type="text" name="crime" placeholder="Crime (termo nas anotações)">
    </div>

    <button class="botao-pesquisar" type="submit">🔍 Pesquisar</button>
  </form>

  <div class="resultado-lista">
    {% for alvo in resultados %}
      <div class="alvo-item">
        <span>{{ alvo.nome }} - {{ alvo.bairro }}</span>
        <button class="ver-btn" onclick="abrirModal(
          '{{ alvo.nome }}',
          '{{ alvo.bairro }}',
          '{{ alvo.faccao }}',
          '{{ alvo.foto }}',
          `{{ alvo.anotacoes | safe }}`
        )">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    {% endfor %}
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <div class="modal-flex">
        <img id="modal-foto" alt="Foto do Alvo" onclick="expandirFoto(this)">
        <div class="modal-dados">
          <h2 id="modal-nome"></h2>
          <p id="modal-detalhes"></p>
          <div id="modal-anotacoes" class="anotacoes-scroll"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bairrosPorMunicipio = {
      FORTALEZA: ["AEROLANDIA", "AEROPORTO", "ALDEOTA", "ALTO ALEGRE", "ALTO DA BALANÇA", "ALVARO WEYNE",
        "AMADEU FURTADO", "ANCURI", "ANTONIO BEZERRA", "ANTONIO DIOGO", "AUTRAN NUNES",
        "BARRA DO CEARA", "BARROSO", "BELA VISTA", "BENFICA", "BOA VISTA", "BOM FUTURO",
        "BOM JARDIM", "BONSUCESSO", "CACHOEIRINHA", "CAIS DO PORTO", "CAJAZEIRAS", "CAMBEBA",
        "CANINDEZINHO", "CARLITO PAMPLONA", "CENTRO", "CIDADE 2000", "CIDADE DOS FUNCIONARIOS",
        "COAÇU", "COCO", "CONJUNTO CEARA", "CONJUNTO ESPERANÇA", "CONJUNTO PALMEIRAS",
        "COUTO FERNANDES", "CRISTO REDENTOR", "CURIO", "DAMAS", "DE LOURDES", "DEMOCRITO ROCHA",
        "DENDE", "DIAS MACEDO", "DIONISIO TORRES", "DOM LUSTOSA", "EDSON QUEIROZ",
        "ENGENHEIRO LUCIANO CAVALCANTE", "FARIAS BRITO", "FATIMA", "FLORESTA", "GENIBAU", "GRANJA LISBOA",
        "GRANJA PORTUGAL", "GUAJIRU", "HENRIQUE JORGE", "ITAOCA", "ITAPERI", "JACARECANGA",
        "JANGURUSSU", "JARDIM AMERICA", "JARDIM CEARENSE", "JARDIM DAS OLIVEIRAS", "JARDIM GUANABARA",
        "JARDIM IRACEMA", "JOAO XXIII", "JOAQUIM TAVORA", "JOQUEI CLUBE", "JOSE BONIFACIO",
        "JOSE DE ALENCAR", "LAGOA REDONDA", "MANOEL DIAS BRANCO", "MANUEL SATIRO", "MARAPONGA",
        "MEIRELES", "MESSEJANA", "MONDUBIM", "MONTE CASTELO", "MONTESE", "MOURA BRASIL",
        "MUCURIPE", "NOVO MONDUBIM", "OLAVO OLIVEIRA", "PADRE ANDRADE", "PAN AMERICANO",
        "PAPICU", "PARANGABA", "PARQUE ARAXA", "PARQUE DOIS IRMAOS", "PARQUE GENIBAU",
        "PARQUE IRACEMA", "PARQUE MANIBURA", "PARQUE PRESIDENTE VARGAS", "PARQUE SANTA MARIA",
        "PARQUE SANTA ROSA", "PARQUE SAO JOSE", "PARQUELANDIA", "PARREAO", "PASSARE",
        "PATRIOLINO RIBEIRO", "PAUPINA", "PEDRAS", "PICI", "PIRAMBU", "PLANALTO AYRTON SENNA",
        "PRAIA DE IRACEMA", "PREFEITO JOSE WALTER", "PRESIDENTE KENNEDY", "QUINTINO CUNHA",
        "RODOLFO TEOFILO", "SABIAGUABA", "SALINAS", "SAO BENTO", "SAO GERARDO",
        "SAO JOAO DO TAUAPE", "SAPIRANGA", "SERRINHA", "SIQUEIRA", "VARJOTA", "VICENTE PINZON",
        "VILA ELLERY", "VILA PERI", "VILA UNIAO", "VILA VELHA"],
      CAUCAIA: ["JUREMA", "TABAPUÁ", "NOVA METRÓPOLE", "CAPUAN"]
    };

    function atualizarBairros() {
      const municipio = document.getElementById("municipio").value;
      const bairroSelect = document.getElementById("bairro");
      bairroSelect.innerHTML = '<option value="">Bairro</option>';
      if (bairrosPorMunicipio[municipio]) {
        bairrosPorMunicipio[municipio].forEach(bairro => {
          const option = document.createElement("option");
          option.value = bairro;
          option.textContent = bairro;
          bairroSelect.appendChild(option);
        });
      }
    }

    function abrirModal(nome, bairro, faccao, foto, anotacoes) {
  const termo = document.querySelector('input[name="crime"]').value;
const termos = termo.split(" ").filter(t => t);

  const img = document.getElementById('modal-foto');

  // Verifica se é uma URL externa (Cloudinary) ou caminho local
  if (foto.startsWith('http')) {
    img.src = foto;
  } else {
    img.src = `/static/imagem/${foto}`;
  }

  document.getElementById('modal-nome').innerHTML = destacarMultiplos(nome, termos);
document.getElementById('modal-detalhes').innerHTML = `${destacarMultiplos(bairro, termos)} | ${destacarMultiplos(faccao, termos)}`;
document.getElementById('modal-anotacoes').innerHTML = destacarMultiplos(anotacoes, termos);
  document.getElementById('modal').style.display = 'block';
}

function destacarMultiplos(textoOriginal, termos) {
    if (!textoOriginal || termos.length === 0) return textoOriginal;

    const textoNorm = removerAcentos(textoOriginal.toLowerCase());
    const mapa = Array(textoOriginal.length).fill(false);

    termos.forEach(termo => {
      const termoNorm = removerAcentos(termo.toLowerCase());
      const termoNormEsc = termoNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(termoNormEsc, 'gi');
      let match;
      while ((match = regex.exec(textoNorm)) !== null) {
        const start = match.index;
        const end = start + termoNorm.length;
        for (let i = start; i < end; i++) {
          mapa[i] = true;
        }
      }
    });

    let resultado = '';
    let i = 0;
    while (i < textoOriginal.length) {
      if (mapa[i]) {
        resultado += '<span class="highlight">';
        while (i < textoOriginal.length && mapa[i]) {
          resultado += textoOriginal[i];
          i++;
        }
        resultado += '</span>';
      } else {
        resultado += textoOriginal[i];
        i++;
      }
    }

    return resultado;
  }

  function removerAcentos(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function removerAcentos(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function removerAcentos(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

    function fecharModal() {
      document.getElementById('modal').style.display = 'none';
      const expandida = document.querySelector('.modal-foto-expandida');
      if (expandida) expandida.remove();
    }

    function destacarTermo(texto, termo) {
      if (!termo) return texto;
      const regex = new RegExp(`(${termo})`, 'gi');
      return texto.replace(regex, '<span class="highlight">$1</span>');
    }

    function expandirFoto(img) {
      const clone = img.cloneNode();
      clone.className = 'modal-foto-expandida';
      clone.onclick = () => clone.remove();
      document.body.appendChild(clone);
    }
  </script>

</body>
<a href="/menu" class="botao-voltar">
  <i class="fas fa-arrow-left"></i> Voltar ao Menu
</a>
</html>
