<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #c6f6ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 24px;
    }

    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 10px #aaa;
      max-width: 800px;
      width: 100%;
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button-grid form,
    .button-grid .link-button {
      flex: 1 1 180px;
      max-width: 180px;
    }

    button,
    .link-button a {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background-color: #0090ff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    button:hover,
    .link-button a:hover {
      background-color: #0070cc;
    }

    button i,
    .link-button i {
      margin-right: 8px;
    }

    .mapa-container {
      max-width: 800px;
      margin: 30px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h2 {
        font-size: 20px;
      }

      .form-container {
        padding: 15px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        justify-content: center;
      }

      .button-grid form,
      .button-grid .link-button {
        max-width: 100%;
      }

      button,
      .link-button a {
        font-size: 15px;
        padding: 10px;
        border-radius: 6px;
      }

      button i,
      .link-button i {
        margin-right: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <div class="form-container">
      <h2>Menu Principal</h2>
      <div class="button-grid">
        <form action="/cadastro_alvo">
          <button type="submit"><i class="fas fa-user-plus"></i> cadastrar</button>
        </form>

        <form action="/pesquisar_alvo">
          <button type="submit"><i class="fas fa-search"></i> pesquisar</button>
        </form>

        <form action="/comparador">
          <button type="submit"><i class="fas fa-images"></i> Comparar</button>
        </form>

        <!-- Botão Mandados -->
        <div class="link-button">
          <a href="{{ url_for('mandados') }}"><i class="fas fa-map-marker-alt"></i> Mandados</a>
        </div>

        {% if is_moderador or is_admin %}
          <form action="/estatisticas">
            <button type="submit"><i class="fas fa-chart-bar"></i> octopus</button>
          </form>

          <form action="/pesquisa_vinculo">
            <button type="submit"><i class="fas fa-link"></i> Pesq. Vínculo</button>
          </form>

          <form action="/pesquisa_lotes">
            <button type="submit"><i class="fas fa-link"></i> Pesq. lote</button>
          </form>

          <form action="/busca_reversa" method="get">
            <button type="submit"><i class="fas fa-exchange-alt"></i> busc. Anotação</button>
          </form>
        {% endif %}

        {% if is_admin %}
          <form action="/dashboard">
            <button type="submit"><i class="fas fa-chart-column"></i> dashboard</button>
          </form>

          <form action="/gerenciar_usuarios">
            <button type="submit"><i class="fas fa-user-cog"></i> gerenciar</button>
          </form>

          <form action="/visualizar_todos">
            <button type="submit"><i class="fas fa-users"></i> todos cadast.</button>
          </form>

          <form action="/relatorio">
            <button type="submit"><i class="fas fa-file-alt"></i> cadastro/usuário</button>
          </form>

          <form action="/novos_cadastros">
            <button type="submit"><i class="fas fa-clock"></i> ult. inseridos</button>
          </form>
        {% endif %}

        <form action="/logout">
          <button type="submit"><i class="fas fa-sign-out-alt"></i> sair</button>
        </form>
      </div>
    </div>
  </div>

  <h3 style="text-align:center">Total de alvos cadastrados: {{ total }}</h3>

  <div class="mapa-container">
    <iframe 
      src="https://www.google.com/maps/d/embed?mid=1v0LNlxW4r3aY7XhPICRRY5hQ498pbwo" 
      width="100%" 
      height="350" 
      style="border:0;" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
